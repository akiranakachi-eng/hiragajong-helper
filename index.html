<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6F9">
<title>ひらがじゃん たすけ</title>
<style>
:root{
  --bg:#FFF6F9; --bg2:#FCE4EE; --card:#FFFFFF;
  --pink:#E4699A; --pinkD:#BE4B7C; --pinkL:#FFC6DC; --pinkXL:#FFEEF4;
  --ink:#4B3742; --ink2:#9A8090; --line:#F4DAE5;
  --mint:#3FA98F; --mintL:#9BDCC9; --mintXL:#EAF7F3;
  --lilac:#8E6DC6; --lilacL:#D5C4EE; --lilacXL:#F4EFFC;
  --maru:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Yu Gothic Medium","游ゴシック Medium","YuGothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--maru);color:var(--ink);font-size:14px;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;
  height:100vh;height:100svh;display:flex;flex-direction:column;overflow:hidden;padding:0}
header{flex:none;display:flex;align-items:center;gap:7px;padding:7px 12px;background:rgba(255,255,255,.93);
  border-bottom:1px solid var(--line);z-index:20}
h1{font-size:14px;margin:0;letter-spacing:.02em;font-weight:600;color:var(--pinkD);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ver{font-size:10px;color:var(--ink2);letter-spacing:.08em;margin-left:auto;margin-right:2px}
.newg{font-family:var(--maru);display:block;width:100%;margin:14px 0 0;padding:12px;border-radius:12px;
  border:1.5px solid var(--pinkL);background:#fff;color:var(--pinkD);font-size:13.5px;font-weight:600;cursor:pointer}
.ico{font-family:var(--maru);width:31px;height:31px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--ink2);font-size:15px;cursor:pointer;flex:none}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:9px 12px 16px;width:100%;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px 10px;
  margin:0 0 7px;box-shadow:0 2px 10px rgba(200,140,170,.10)}
.card.hi{border-color:var(--pinkL);background:linear-gradient(180deg,#fff,var(--pinkXL))}
.card.win{border-color:var(--mintL);background:linear-gradient(180deg,#fff,var(--mintXL))}
.card h3{margin:0 0 6px;font-size:11.5px;letter-spacing:.09em;color:var(--pinkD);font-weight:600;
  display:flex;align-items:center;gap:6px}
.card h3 em{font-style:normal;color:var(--ink2);font-weight:400;letter-spacing:0;font-size:10.5px;margin-left:auto}

.tile{font-family:var(--maru);display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fff,#FFF3F7);color:var(--ink);border:1px solid #F5CEDF;border-radius:8px;
  box-shadow:0 2px 0 #F7C9DB,0 3px 6px rgba(200,120,155,.16);cursor:pointer;padding:0;font-weight:500}
.tile:active{transform:translateY(1px);box-shadow:0 1px 0 #F7C9DB}
.tile.gray{background:#F4EFF2;color:#BCACB6;border-color:#EBE0E7;box-shadow:none}

/* てはい */
.rack{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-start}
.rack .tile{width:29px;height:38px;font-size:19px}
.rack .ph{width:29px;height:38px;border-radius:8px;border:1.5px dashed var(--pinkL);background:rgba(255,255,255,.5)}
.grpw{display:flex;flex-direction:column;align-items:center;gap:1px}
.grpw .cap{font-size:9px;letter-spacing:.06em;color:var(--mint);font-weight:600}
.grpw.meld .cap{color:var(--lilac)}
.grp{display:flex;gap:2px;padding:4px;border-radius:10px;background:var(--mintXL);
  border:1.5px solid var(--mintL);cursor:pointer}
.grpw.meld .grp{background:var(--lilacXL);border-color:var(--lilacL)}
.grp .tile{width:26px;height:34px;font-size:17.5px;pointer-events:none;box-shadow:0 1px 0 #F7C9DB}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}

.bar{height:7px;border-radius:4px;background:var(--pinkXL);overflow:hidden;margin:8px 0 5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pinkL),var(--pink));border-radius:5px;transition:width .3s}
.meta{font-size:11.5px;color:var(--ink2);line-height:1.6;margin:5px 0 0}
.meta b{color:var(--pinkD);font-weight:600}

/* こうほ（コンパクト） */
.cands{display:flex;flex-wrap:wrap;gap:5px}
.cand{font-family:var(--maru);padding:6px 11px;border-radius:999px;background:#fff;
  border:1.5px solid var(--pinkL);color:var(--ink);font-size:14.5px;letter-spacing:.04em;cursor:pointer;
  display:inline-flex;align-items:baseline;gap:1px}
.cand.rec{background:var(--mintXL);border-color:var(--mintL)}
.cand.nomean{color:var(--ink2)}
.cand u{text-decoration:none;font-size:9.5px;color:var(--pinkL);margin-left:3px}
.cand b{color:var(--pink);font-weight:700}
.cand i{font-style:normal;font-size:9.5px;color:var(--ink2);margin-left:5px;letter-spacing:0;opacity:.85}
.cand.willwin{background:var(--mintXL);border-color:var(--mint)}
.sub2{font-size:10px;letter-spacing:.1em;color:var(--ink2);margin:8px 0 4px}
.sub2:first-of-type{margin-top:2px}
.tin{font-family:var(--maru);width:100%;padding:12px;border-radius:13px;border:1.5px solid var(--pinkL);font-size:15px;color:var(--ink);background:#fff}
.cand:active{transform:translateY(1px)}

.wait{display:flex;flex-wrap:wrap;gap:6px}
.w1{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px 3px;border-radius:9px;
  background:var(--mintXL);border:1.5px solid var(--mintL);cursor:pointer}
.w1 .tile{width:30px;height:39px;font-size:20px;pointer-events:none}
.w1 .cnt{font-size:9.5px;color:var(--mint);font-weight:600;white-space:nowrap}
.w1.top{background:var(--mintXL);border-color:var(--mintL)}
.w1.top .cnt{color:var(--mint);font-weight:600}
.info{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--pinkXL);
  border-left:3px solid var(--pink);font-size:12.5px;line-height:1.7}
.info .w{color:var(--pinkD);font-weight:600}
.strip{display:flex;flex-wrap:wrap;gap:3px}
.strip .tile{width:22px;height:29px;font-size:14px}

.foot{flex:none;z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);border-top:1px solid var(--line);
  display:flex;gap:7px;width:100%;max-width:560px;margin:0 auto}
.foot button{font-family:var(--maru);flex:1;padding:12px 5px;border-radius:12px;border:none;
  font-size:13.5px;font-weight:600;cursor:pointer;letter-spacing:.03em}
.b1{background:var(--pink);color:#fff}
.b2{background:#fff;color:var(--pinkD);border:1.5px solid var(--pinkL)}
.foot button[disabled]{background:var(--pinkXL);color:var(--ink2);border:none}

.veil{position:fixed;inset:0;background:rgba(75,55,66,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:var(--vvb,0px);z-index:50;background:var(--card);border-radius:20px 20px 0 0;
  padding:13px 14px calc(16px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .22s ease;
  max-width:560px;margin:0 auto;max-height:88dvh;overflow-y:auto;box-shadow:0 -6px 24px rgba(160,100,130,.2)}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--pinkL);margin:0 auto 12px}
.sheet h2{margin:0 0 3px;font-size:14px;color:var(--pinkD);font-weight:600}
.sheet .sub{margin:0 0 11px;font-size:12px;color:var(--ink2)}
.bigword{display:flex;justify-content:center;gap:4px;margin:2px 0 12px}
.bigword .tile{width:42px;height:55px;font-size:27px;pointer-events:none}
.tabs{display:flex;gap:5px;margin:0 0 8px}
.tab{font-family:var(--maru);font-size:12px;padding:7px 12px;border-radius:999px;border:1px solid var(--pinkL);
  background:#fff;color:var(--pinkD);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
.kb{display:grid;gap:4px}
.kb .tile{aspect-ratio:3/4;width:100%;font-size:16px}
.kb .tile[disabled]{background:#F5EFF2;color:#C9BAC3;border-color:#EEE2E9;box-shadow:none;cursor:default}
.kb .none{visibility:hidden}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.acts button,.acts a{font-family:var(--maru);display:block;text-align:center;text-decoration:none;
  padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.a1{background:var(--pink);color:#fff}
.a2{background:#fff;color:var(--pinkD);border:1.5px solid var(--pinkL)}
.a3{background:#F7F2F5;color:var(--ink2)}
.wrow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.tag{font-size:10px;letter-spacing:.08em;padding:4px 8px;border-radius:7px;background:var(--pink);color:#fff;flex:none}
.tag.kan{background:var(--lilac)}
.pill{font-family:var(--maru);flex:none;padding:9px 14px;border-radius:999px;border:none;
  background:var(--pink);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
.big{text-align:center;padding:14px 8px 6px}
.big .em{font-size:24px;color:var(--mint);font-weight:600;letter-spacing:.06em}
.big p{margin:7px 0 0;font-size:13px;color:var(--ink2)}
.note{font-size:10.5px;color:var(--ink2);line-height:1.6;margin:12px 0 0;padding-top:9px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <span class="ver">v1.0</span>
  <button class="ico" id="book" title="ずかん">📖</button>
</header>
<main id="app"></main>
<div class="foot" id="foot"></div>
<div class="veil" id="veil"></div>

let phase="setup", hand=[], keeps=[], seen=[], kbmode="main", ana=null;
const LSG="hiragajong_game";
function saveGame(){try{localStorage.setItem(LSG,JSON.stringify({phase,hand,keeps,seen}))}catch(e){}}
function loadGame(){try{const g=JSON.parse(localStorage.getItem(LSG)||"null");
  if(g&&Array.isArray(g.hand)){phase=g.phase||"setup";hand=g.hand;keeps=g.keeps||[];seen=g.seen||[]}}catch(e){}}

const $=id=>document.getElementById(id);
const cnt=a=>{const p={};for(const c of a)p[c]=(p[c]||0)+1;return p};
const sortHand=()=>hand.sort((a,b)=>ORD[a]-ORD[b]);
const psOf=a=>a.slice().sort((x,y)=>ORD[x]-ORD[y]).join("");
function slots(){let s2=1,s3=4;for(const k of keeps){k.w.length===2?s2--:s3--}return{s2:Math.max(0,s2),s3:Math.max(0,s3)}}
function need(){const{s2,s3}=slots();return s2*2+s3*3}
function fits(w,p){const c=CNT[w];for(const ch in c)if(c[ch]>(p[ch]||0))return false;return true}
function useW(w,ps){let t=ps;for(const ch of w){const i=t.indexOf(ch);if(i<0)return null;t=t.slice(0,i)+t.slice(i+1)}return t}
const BUDGET=20000, CAP3=45, CAP2=30;
function pick(list,cap){const seen=new Set(),out=[];
  for(const w of list){const k=[...w].sort((a,b)=>ORD[a]-ORD[b]).join("");
    if(seen.has(k))continue;seen.add(k);out.push(w);if(out.length>=cap)break}return out}
function cover(ps,s2,s3,c2,c3){
  const memo=new Map();let steps=0;
  function go(p,r2,r3){
    const k=p+"|"+r2+r3,hit=memo.get(k);if(hit!==undefined)return hit;
    if(++steps>BUDGET)return{cov:0,words:[]};
    let best={cov:0,words:[]},lim=r3*3+r2*2;
    if(r3>0)for(const w of c3){const q=useW(w,p);if(q===null)continue;
      const sub=go(q,r2,r3-1);
      if(3+sub.cov>best.cov){best={cov:3+sub.cov,words:[w,...sub.words]};if(best.cov===lim)break}}
    if(best.cov<lim&&r2>0)for(const w of c2){const q=useW(w,p);if(q===null)continue;
      const sub=go(q,r2-1,r3);
      if(2+sub.cov>best.cov){best={cov:2+sub.cov,words:[w,...sub.words]};if(best.cov===lim)break}}
    memo.set(k,best);return best;
  }
  return go(ps,s2,s3);
}
function analyze(){
  const{s2,s3}=slots(),N=need(),pool=cnt(hand),ps=psOf(hand);
  const f2=s2?BYLEN[2].filter(w=>fits(w,pool)):[], f3=s3?BYLEN[3].filter(w=>fits(w,pool)):[];
  const cv=cover(ps,s2,s3,pick(f2,CAP2),pick(f3,CAP3));
  const agari=(hand.length===N&&cv.cov===N);
  const rec=new Set(cv.words);
  const ord=(a,b)=>(rec.has(b)-rec.has(a))||(hasMean(b)-hasMean(a))||(GRD[a]-GRD[b]);
  const make3=f3.slice().sort(ord), make2=f2.slice().sort(ord);
  const make=[...make3,...make2];
  /* あと1もじで とどく ことば → ほしい はい */
  const near={}, far=[];
  for(const L of [2,3]){ if(L===2&&!s2)continue; if(L===3&&!s3)continue;
    for(const w of BYLEN[L]){const c=CNT[w];const ms=[];let n=0;
      for(const ch in c){const d=c[ch]-(pool[ch]||0);if(d>0){n+=d;for(let i=0;i<d;i++)ms.push(ch);if(n>2)break}}
      if(n===1)(near[ms[0]]=near[ms[0]]||[]).push(w);
      else if(n===2&&L===3)far.push({w,ms})}}
  const wants=[],seenAll=cnt(hand.concat(seen,...keeps.map(k=>[...k.w])));
  const last=(hand.length+1===N);
  for(const c in near){
    const rest=INV[c]-(seenAll[c]||0); if(rest<=0)continue;
    let win=false;
    if(last){const g2=pick(f2.concat(near[c].filter(w=>w.length===2)),CAP2),
                   g3=pick(f3.concat(near[c].filter(w=>w.length===3)),CAP3);
      win=cover(psOf(hand.concat([c])),s2,s3,g2,g3).cov===N}
    const ws=near[c].slice().sort((a,b)=>(hasMean(b)-hasMean(a))||(GRD[a]-GRD[b]));
    wants.push({c,rest,win,n:ws.length,words:ws.slice(0,6)});
  }
  wants.sort((a,b)=>(b.win-a.win)||(b.n*b.rest-a.n*a.rest));
  /* いろんな はいが ならぶように、1もじずつ かわりばんこで あつめる */
  const per=wants.map(o=>({o,ws:(near[o.c]||[]).slice()
    .sort((a,b)=>(hasMean(b)-hasMean(a))||(GRD[a]-GRD[b]))}));
  let nextTotal=0; for(const p of per) nextTotal+=p.ws.length;
  const roll=(len,cap)=>{
    const out=[];
    for(let i=0,go=true;go&&out.length<cap;i++){
      go=false;
      for(const p of per){
        const ws=p.ws.filter(w=>w.length===len);
        if(!ws[i])continue;
        out.push({w:ws[i],c:p.o.c,rest:p.o.rest,win:p.o.win}); go=true;
        if(out.length>=cap)break;
      }
    }
    return out.sort((a,b)=>b.win-a.win);
  };
  const nexts3=roll(3,21), nexts2=roll(2,8);
  let fars=[];
  if(s3 && nexts3.length<8){
    const seenAll2=seenAll;
    fars=far.map(o=>{
      const r=o.ms.map(ch=>INV[ch]-(seenAll2[ch]||0));
      return {w:o.w,ms:o.ms,rest:Math.min(...r)};
    }).filter(o=>o.rest>0)
      .sort((a,b)=>(hasMean(b.w)-hasMean(a.w))||(b.rest-a.rest)||(GRD[a.w]-GRD[b.w]))
      .slice(0,12);
  }
  const winTiles=wants.filter(o=>o.win);
  return{N,cover:cv,agari,make,make3,make2,rec,wants,nexts3,nexts2,nextTotal,fars,winTiles};
}
function ponFor(c){
  const out=[],p={...cnt(hand)};p[c]=(p[c]||0)+1;
  if(slots().s3>0)for(const L of[3,4,5])for(const w of BYLEN[L])
    if(w.includes(c)&&fits(w,p))out.push({w,kind:L===3?"ポン":"カン"});
  out.sort((a,b)=>(hasMean(b.w)-hasMean(a.w))||(GRD[a.w]-GRD[b.w]));
  return out.slice(0,8);
}

  else m.innerHTML=`<span class="w">いみ</span>　まだ ずかんに のって いないよ。したで しらべて、おしえてね。`;
  s.appendChild(m);
  if(nx){
    const n=el("div","info");
    n.innerHTML=nx.win
      ? `<span class="w">${nx.c}</span>　これが くれば <b>あがり</b>！ やまと みんなの てに のこり <b>${nx.rest}まい</b>`
      : nx.two
        ? `<span class="w">${nx.c}</span>　この 2まいが くれば つくれるよ。すくない ほうで のこり <b>${nx.rest}まい</b>`
        : `<span class="w">${nx.c}</span>　この はいが くれば つくれるよ。やまと みんなの てに のこり <b>${nx.rest}まい</b>`;
    s.appendChild(n);
  }
  const a=el("div","acts");
  if(nx){ }else if(kind){
    const b=el("button","a1","くずす");
    b.onclick=()=>{if(keeps[idx].kind==="きめた"){hand=hand.concat([...w]);sortHand()}keeps.splice(idx,1);close();render()};
    a.appendChild(b);
  }else{
    const b=el("button","a1","きめる");
    b.onclick=()=>{for(const ch of w){const i=hand.indexOf(ch);if(i>=0)hand.splice(i,1)}
      keeps.push({w,kind:"きめた"});close();render()};
    a.appendChild(b);
  }
  a.appendChild(lookupLink(w));
  const t=el("input");t.className="tin";t.type="text";t.placeholder="この ことばの いみを かいて おぼえさせる";
  t.value=USER[w]||"";

    if(v){USER[w]=v}else{delete USER[w]} saveUser();
    m.innerHTML=v?`<span class="w">いみ</span>　${v}`:`<span class="w">いみ</span>　まだ ずかんに のって いないよ。`;
    sv.textContent="いれたよ！";setTimeout(()=>sv.textContent="ずかんに いれる",1200)};
  a.appendChild(t);a.appendChild(sv);
  const c=el("button","a3","とじる");c.onclick=close;a.appendChild(c);
  s.appendChild(a);open_();

function winSheet(o){
  const s=sheetHead("この はいが くれば あがり！","やまと みんなの てに のこり "+o.rest+"まい");
  const bw=el("div","bigword"); bw.appendChild(tileEl(o.c)); s.appendChild(bw);

function pickSheet(title,sub,pick){

  const t=el("div","tabs");
  [["main","せいおん"],["dak","だくおん"],["sml","ちいさい じ"]].forEach(([k,x])=>{

    b.onclick=()=>{kbmode=k;pickSheet(title,sub,pick)};t.appendChild(b)});
  s.appendChild(t); s.appendChild(kbGrid(pick));
  const a=el("div","acts");const c=el("button","a3","やめる");c.onclick=close;a.appendChild(c);

function kbGrid(pick){
  const rows=kbmode==="main"?KB_MAIN:kbmode==="dak"?KB_DAK:KB_SML;
  const g=el("div","kb");
  g.style.gridTemplateColumns=`repeat(${rows[0].length},1fr)`;
  if(kbmode!=="main")g.style.maxWidth="240px";
  const used=cnt(hand.concat(seen,...keeps.map(k=>[...k.w])));
  rows.forEach(r=>r.forEach(ch=>{
    if(!ch){g.appendChild(el("div","none"));return}
    const b=tileEl(ch); if(INV[ch]-(used[ch]||0)<=0)b.disabled=true;
    b.onclick=()=>pick(ch); g.appendChild(b);
  }));
  return g;
}

/* ===== がめん ===== */
function render(){
  saveGame();
  const app=$("app");app.innerHTML="";
  if(phase==="setup")return renderSetup(app);
  sortHand(); ana=analyze(); renderPlay(app); renderFoot();
}
function renderSetup(app){
  const N=need();
  const c=el("div","card hi");
  c.appendChild(el("h3",null,"くばられた はいを いれよう"));
  const r=el("div","rack");
  hand.forEach((ch,i)=>{const b=tileEl(ch);b.onclick=()=>{hand.splice(i,1);render()};r.appendChild(b)});
  for(let i=hand.length;i<N-1;i++)r.appendChild(el("div","ph"));
  c.appendChild(r);
  const p=el("p","meta");
  p.innerHTML=`あと <b>${Math.max(0,N-1-hand.length)}</b>まい。したの はいを おしてね（まちがえたら うえの はいを タップ）`;
  c.appendChild(p);app.appendChild(c);
  const k=el("div","card");
  const t=el("div","tabs");
  [["main","せいおん"],["dak","だくおん"],["sml","ちいさい じ"]].forEach(([m,x])=>{
    const b=el("button","tab",x);b.type="button";b.setAttribute("aria-pressed",m===kbmode);
    b.onclick=()=>{kbmode=m;render()};t.appendChild(b)});
  k.appendChild(t);
  k.appendChild(kbGrid(ch=>{hand.push(ch);if(hand.length>=N-1)phase="play";render()}));
  app.appendChild(k);
  const f=$("foot");f.innerHTML="";
  if(hand.length>=2){const b=el("button","b1","これで はじめる");b.onclick=()=>{phase="play";render()};f.appendChild(b)}
  const d=el("button","b2","テスト：くばる");
  d.onclick=()=>{const wall=[];for(const c2 in INV)for(let i=0;i<INV[c2];i++)wall.push(c2);
    for(let i=wall.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[wall[i],wall[j]]=[wall[j],wall[i]]}
    hand=wall.slice(0,need()-1);keeps=[];seen=[];phase="play";render()};
  f.appendChild(d);
}

function renderPlay(app){
  const N=ana.N, extra=(hand.length>N-1 && !ana.agari);

  if(ana.agari){
    const c=el("div","card win");
    const b=el("div","big");b.appendChild(el("div","em","あがり！ 🎉"));
    b.appendChild(el("p",null,"ことばが ぜんぶ そろったよ"));
    c.appendChild(b);
    const cs=el("div","cands");
    keeps.map(k=>k.w).concat(ana.cover.words).forEach(w=>{
      const p=el("button","cand rec",w);p.onclick=()=>wordSheet(w,null,-1);cs.appendChild(p)});
    c.appendChild(cs);app.appendChild(c);
  }

  /* てはい（きめた ことばも ここに ならぶ） */
  const c=el("div","card"+(extra?" hi":""));
  const h=el("h3",null, extra?"どの はいを すてる？":"てはい");
  h.appendChild(el("em",null,`${hand.length+keeps.reduce((a,k)=>a+k.w.length,0)}まい`));
  c.appendChild(h);
  const r=el("div","rack");
  keeps.forEach((k,i)=>{
    const wrap=el("div","grpw"+(k.kind==="きめた"?"":" meld"));
    const g=el("div","grp");for(const ch of k.w)g.appendChild(tileEl(ch));
    g.onclick=()=>wordSheet(k.w,k.kind,i);
    wrap.appendChild(g);wrap.appendChild(el("div","cap",k.kind));
    r.appendChild(wrap);
  });
  if(keeps.length&&hand.length)r.appendChild(el("div","sep"));
  hand.forEach((ch,i)=>{
    const b=tileEl(ch);
    b.onclick=()=>{ if(extra){seen.push(ch);hand.splice(i,1);render()} else discardPeek(ch,i,c) };
    r.appendChild(b);
  });
  for(let i=hand.length;i<N;i++)r.appendChild(el("div","ph"));
  c.appendChild(r);
  const done=keeps.length+ana.cover.words.length;
  const bar=el("div","bar");const fi=el("i");fi.style.width=Math.round(done/5*100)+"%";bar.appendChild(fi);
  c.appendChild(bar);
  const p=el("p","meta");
  p.innerHTML = extra
    ? `いらない はいを タップして すてよう。ことばは <b>${done}こ</b> できて いるよ。`
    : `5つの ことばの うち <b>${done}こ</b> できたよ。あと <b>${5-done}こ</b>！`;
  c.appendChild(p);
  if(keeps.some(k=>k.draw>0)&&hand.length<N-1){
    const d=keeps.reduce((a,k)=>a+(k.draw||0),0);
    c.appendChild(el("p","meta","カンを したから、やまから "+d+"まい ひいてね（「ツモった」から）"));
  }
  app.appendChild(c);

  if(!ana.agari){
    const {s2,s3}=slots();
    const c2=el("div","card");
    const h2=el("h3",null,"ことば");
    h2.appendChild(el("em",null,`いま ${ana.make.length}こ ／ あと1まいで ${ana.nextTotal}こ`));
    c2.appendChild(h2);
    const mark=(b,w)=>{ if(!hasMean(w))b.appendChild(el("u",null,"?")); return b };
    const pill=w=>{const b=el("button","cand"+(ana.rec.has(w)?" rec":"")+(hasMean(w)?"":" nomean"),w);
      mark(b,w); b.onclick=()=>wordSheet(w,null,-1); return b};
    const npill=o=>{const b=el("button","cand"+(hasMean(o.w)?"":" nomean"));
      const need={}; (o.ms||[o.c]).forEach(ch=>need[ch]=(need[ch]||0)+1);
      for(const ch of o.w){ if(need[ch]>0){need[ch]--;b.appendChild(el("b",null,ch))}
        else b.appendChild(document.createTextNode(ch)) }
      b.appendChild(el("i",null,"のこり"+o.rest)); mark(b,o.w);
      b.onclick=()=>wordSheet(o.w,null,-1,o.ms?{c:o.ms.join("と"),rest:o.rest,two:true}:o);
      return b};
    const group=(label,nodes)=>{ if(!nodes.length)return;
      c2.appendChild(el("div","sub2",label));
      const cs=el("div","cands"); nodes.forEach(n=>cs.appendChild(n)); c2.appendChild(cs) };

    /* あがり：ことばでは なく「まちの はい」を ならべる */
    if(ana.winTiles.length){
      c2.appendChild(el("div","sub2","この はいが くれば あがり！"));
      const w=el("div","wait");
      ana.winTiles.forEach(o=>{
        const dd=el("div","w1");
        dd.appendChild(tileEl(o.c));
        dd.appendChild(el("span","cnt","のこり"+o.rest));
        dd.onclick=()=>winSheet(o);
        w.appendChild(dd)});
      c2.appendChild(w);
    }

    const oth3=ana.nexts3.filter(o=>!o.win), oth2=ana.nexts2.filter(o=>!o.win);
    if(s3) group("いま つくれる（3もじ）", ana.make3.slice(0,16).map(pill));
    if(s2) group("いま つくれる（2もじ）", ana.make2.slice(0,8).map(pill));
    if(s3){
      group("あと 1まいで（3もじ）", oth3.map(npill));
      if(ana.fars.length && !ana.winTiles.length) group("あと 2まいで（3もじ）", ana.fars.map(npill));
    }
    if(s2) group("あと 1まいで（2もじ）", oth2.slice(0,8).map(npill));
    if(!c2.querySelector(".cands"))
      c2.appendChild(el("p","meta","いま みえる ことばが ないよ。きめた ことばを くずすと べつの みちが みつかるかも。"));
    c2.appendChild(el("p","meta","タップで いみが みられるよ。みどり＝のこすと よい ことば、ピンクの もじ＝まだ もって いない はい、? ＝ずかんに まだ ない ことば。"));
    app.appendChild(c2);
  }

  if(seen.length){
    const c4=el("div","card");
    const h4=el("h3",null,"すてられた はい");h4.appendChild(el("em",null,seen.length+"まい"));c4.appendChild(h4);
    const s=el("div","strip");
    seen.forEach((ch,i)=>{const b=tileEl(ch,"gray");b.onclick=()=>{seen.splice(i,1);render()};s.appendChild(b)});
    c4.appendChild(s);
    c4.appendChild(el("p","meta","タップで けせるよ。ここの はいは「のこり」から ひいて かぞえて います。"));
    app.appendChild(c4);
  }
  app.appendChild(el("p","note","ことば "+Object.keys(DICT).length+"ご。いみが ない ことばは「もっと しらべる」で ひけるよ。"));
  const ng=el("button","newg","あたらしい ゲームを はじめる"); ng.id="reset2"; ng.onclick=askNew;
  app.appendChild(ng);
}
function discardPeek(ch,i,host){
  host.querySelectorAll(".info").forEach(e=>e.remove());
  const rest=hand.slice();rest.splice(i,1);
  const{s2,s3}=slots(),p=cnt(rest);
  const cv=bestCover(p,s2,s3,BYLEN[2].filter(w=>fits(w,p)),BYLEN[3].filter(w=>fits(w,p)));
  const before=keeps.length+ana.cover.words.length, after=keeps.length+cv.words.length;
  const m=el("div","info");
  m.innerHTML=`<span class="w">${ch}</span>　これを すてても、ことばは <b>${after}こ</b> のままだよ。`;
  if(after<before) m.innerHTML=`<span class="w">${ch}</span>　これを すてると、ことばが <b>${after}こ</b>に へっちゃう（いまは ${before}こ）。`;
  host.appendChild(m);
}

  const f=$("foot");f.innerHTML="";
  if(hand.length<ana.N){
    const b=el("button","b1","ツモった");
    b.onclick=()=>pickSheet("ひいた はいは？","1つ えらんでね",ch=>{hand.push(ch);close();render()});
    f.appendChild(b);
  }else if(ana.agari){
    const b=el("button","b1","あがり！ おめでとう 🎉");b.disabled=true;f.appendChild(b);
  }else{
    const b=el("button","b1","すてる はいを タップ");b.disabled=true;f.appendChild(b);
  }
  const b2=el("button","b2","あいてが すてた");
  b2.onclick=()=>pickSheet("あいてが すてた はいは？","1つ えらんでね",ch=>afterDiscard(ch));
  f.appendChild(b2);
}
function afterDiscard(ch){
  const list=ponFor(ch);
  const p2=cnt(hand.concat([ch])),{s2,s3}=slots();
  const cv=bestCover(p2,s2,s3,BYLEN[2].filter(w=>fits(w,p2)),BYLEN[3].filter(w=>fits(w,p2)));
  const ron=(hand.length+1===need()&&cv.cov===need());
  if(!list.length&&!ron){seen.push(ch);close();render();return}
  const s=sheetHead(ron?"ロン できる！ 🎉":"ポン・カン できるよ","「"+ch+"」を つかうと この ことばが つくれるよ");
  list.forEach(o=>{
    const row=el("div","wrow");
    row.appendChild(el("span","tag"+(o.kind==="カン"?" kan":""),o.kind));
    const b=el("button","cand rec",o.w);b.style.flex="1";b.onclick=()=>wordPeek(o.w);
    row.appendChild(b);
    const g=el("button","pill",o.kind+"する");
    g.onclick=()=>{const rest=[...o.w];rest.splice(rest.indexOf(ch),1);
      for(const c2 of rest){const i=hand.indexOf(c2);if(i>=0)hand.splice(i,1)}
      keeps.push({w:o.w,kind:o.kind,draw:o.kind==="カン"?o.w.length-3:0});close();render()};
    row.appendChild(g);s.appendChild(row);
  });
  const a=el("div","acts");
  const no=el("button","a2","なにも しない");no.onclick=()=>{seen.push(ch);close();render()};
  a.appendChild(no);s.appendChild(a);open_();
}
function wordPeek(w){
  const s=$("sheet");s.querySelectorAll(".info").forEach(e=>e.remove());
  const m=el("div","info");m.innerHTML=`<span class="w">${w}</span>　${meaning(w)}`;s.appendChild(m);
}

$("book").onclick=()=>{
  const n=Object.keys(USER).length;
  const s=sheetHead("ことばの ずかん", "アプリに "+Object.keys(DICT).length+"ご、じぶんで おしえたのが "+n+"ご");
  s.appendChild(el("p","meta","おしえた いみと あそんで いる とちゅうの てはいは、この たんまつだけに のこるよ。ほかの スマホとは べつべつ。"));
  const a=el("div","acts");
  const ex=el("button","a2","おしえた ことばを かきだす");
  ex.onclick=()=>{const blob=new Blob([JSON.stringify(USER,null,1)],{type:"application/json"});
    const u=URL.createObjectURL(blob),l=document.createElement("a");
    l.href=u;l.download="hiragajong-words.json";l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
  a.appendChild(ex);
  const inp=el("input");inp.type="file";inp.accept="application/json";inp.className="tin";
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{Object.assign(USER,JSON.parse(r.result));saveUser();close();alert("よみこんだよ")}catch(x){alert("よみこめなかった")}};
    r.readAsText(f)};
  a.appendChild(el("p","meta","よみこむ ファイルを えらぶ:"));a.appendChild(inp);
  const c=el("button","a3","とじる");c.onclick=close;a.appendChild(c);
  s.appendChild(a);open_();
};
function askNew(){
  if(hand.length+keeps.length===0){newGame();return}
  const sh=sheetHead("あたらしい ゲームを はじめる？","いまの てはいと きめた ことばは きえちゃうよ");
  const a=el("div","acts");
  const y=el("button","a1","はじめる"); y.onclick=newGame; a.appendChild(y);
  const n=el("button","a3","やめる"); n.onclick=close; a.appendChild(n);
  sh.appendChild(a); open_();
}
loadGame();
render();
